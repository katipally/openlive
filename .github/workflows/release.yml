name: Release

# Push a tag like v0.1.0 → fully automatic release. Once CI's `check` job passed
# on the tagged commit, builds the Mac, Windows and Linux installers on their
# native runners, uploads them to a draft GitHub Release named after the tag, then
# (once ALL succeed) publishes it so it's downloadable. No manual step. If CI or a
# build fails the release stays a draft (nothing goes live).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # electron-builder needs this to create the release + upload assets

# Never cancel a release half way through; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag push starts this run and CI together, so wait for CI's `check` job
  # (ci.yml) on the tagged commit instead of assuming it already finished.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read
    steps:
      - name: Require CI check on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 80); do
            conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=check" \
              --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // empty')
            case "$conclusion" in
              success) echo "CI check passed"; exit 0 ;;
              "") echo "Waiting for the CI check ($i/80)..."; sleep 15 ;;
              *) echo "::error::CI check concluded $conclusion on ${{ github.sha }}"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for the CI check on ${{ github.sha }}"
          exit 1

  build:
    needs: gate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: win
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json "packageManager" — no pin to drift.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The git tag is the single source of truth for the version. Stamp it into
      # the desktop package.json so electron-builder names the installers and
      # app.getVersion() (shown in the UI) both report the released version — no
      # manual package.json bump needed.
      - name: Set version from tag
        shell: bash
        run: |
          export V="${GITHUB_REF_NAME#v}"
          node -e "const f='apps/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f));p.version=process.env.V;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "Building version $V"

      # The ol-input addon (Flow's hotkey + text insertion) is Rust. The mac build
      # is one universal binary, so it needs both Apple targets; pack-native fails
      # if either is missing rather than shipping a host-only addon.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Assemble the Next standalone server, the agent bundle and the native addon
      # into dist/ (these are what Electron packages as unpacked resources).
      - name: Pack web + agent + native
        run: |
          pnpm --filter @openlive/desktop pack:web
          pnpm --filter @openlive/desktop pack:agent
          pnpm --filter @openlive/desktop pack:native
          pnpm --filter @openlive/desktop pack:licenses

      # Stamps where usage telemetry goes into the build. These are public values,
      # so repository variables, not secrets. If any of the three is unset nothing
      # is written and this release sends no telemetry (see RELEASING.md).
      - name: Stamp telemetry settings
        run: pnpm --filter @openlive/desktop pack:telemetry
        env:
          OPENLIVE_TELEMETRY_ENDPOINT: ${{ vars.OPENLIVE_TELEMETRY_ENDPOINT }}
          OPENLIVE_TELEMETRY_CLIENT_ID: ${{ vars.OPENLIVE_TELEMETRY_CLIENT_ID }}
          OPENLIVE_TELEMETRY_ORIGIN: ${{ vars.OPENLIVE_TELEMETRY_ORIGIN }}

      # Only a build marked here runs the auto-updater. A local build is signed with
      # another identity, so it could not install the update it downloads.
      - name: Mark as a release build
        run: pnpm --filter @openlive/desktop pack:release-marker
        env:
          OPENLIVE_RELEASE_BUILD: "1"

      # Apple's notary service is intermittently flaky (returns empty/unexpected
      # results). Retry a few times so a transient notarization blip doesn't fail
      # the whole release; electron-builder overwrites its own assets on republish.
      - name: Build & publish (macOS — signed + notarized)
        if: matrix.name == 'mac'
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm --filter @openlive/desktop exec electron-builder --mac --publish always && exit 0
            echo "::warning::electron-builder attempt $i failed (likely flaky notarization); retrying in 30s…"
            sleep 30
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (skipped automatically if these are unset):
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization (skipped automatically if these are unset):
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build & publish (Windows)
        if: matrix.name == 'win'
        run: pnpm --filter @openlive/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Linux — unsigned AppImage)
        if: matrix.name == 'linux'
        run: pnpm --filter @openlive/desktop exec electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every platform uploaded its assets to the draft release. Flip it to
  # published (and mark it "Latest") so it's downloadable. Runs only if every
  # build succeeded, so a half-built release never goes public.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Need the repo checked out to read CHANGELOG.md for the release highlights.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Give users a clean release: this version's CHANGELOG highlights, a download
      # table pointing at the three installers. The *.yml, *.blockmap and mac *.zip
      # stay: auto-update (electron-updater) needs them, the blockmaps for
      # differential downloads.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/$REPO/releases/download/$TAG"
          # Best-effort: pull this tag's section out of CHANGELOG.md. Empty if the
          # file or section is missing — the release still publishes with the table.
          HIGHLIGHTS=""
          if [ -f CHANGELOG.md ]; then
            HIGHLIGHTS=$(awk -v v="${TAG#v}" 'index($0,"## ["v"]")==1{f=1;print;next} f&&/^## \[/{exit} f&&/^\[.*\]: /{exit} f{print}' CHANGELOG.md || true)
          fi
          NOTES="## Download OpenLive ${TAG}

          | Platform | Download |
          | --- | --- |
          | **macOS** (Apple Silicon + Intel) | [\`${TAG}\` Mac (.dmg)](${BASE}/OpenLive-${TAG#v}-mac.dmg) |
          | **Windows** (64-bit) | [\`${TAG}\` Windows (.exe)](${BASE}/OpenLive-${TAG#v}-windows.exe) |
          | **Linux** (64-bit) | [\`${TAG}\` Linux (.AppImage)](${BASE}/OpenLive-${TAG#v}-linux.AppImage) |

          On first launch, macOS may take a few seconds to verify the app. That's normal.
          "
          if [ -n "$HIGHLIGHTS" ]; then
            NOTES="${NOTES}
          ---

          ${HIGHLIGHTS}"
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest --notes "$NOTES"
