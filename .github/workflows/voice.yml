name: Voice regression

# Renders the corpus replies through the app's chunking, synthesis and
# stitching, and fails when the voice gets less continuous (tools/voice-regress).
# PRs that touch the voice path run the fast tier on Linux; every engine runs
# nightly on macOS. Models download on first use and are cached by the model
# list (engines.ts pins each file's SHA-256).

on:
  pull_request:
    paths:
      - "apps/web/src/lib/live/voiceText.ts"
      - "apps/web/src/lib/live/pcm.ts"
      - "apps/web/src/lib/live/models.worker.ts"
      - "apps/web/src/lib/live/supertonic.ts"
      - "apps/web/src/lib/live/voiceEngine.ts"
      - "apps/web/src/lib/live/audioPlayback.ts"
      - "apps/web/src/lib/live/pipelineConfig.ts"
      - "packages/shared/src/speech/**"
      - "services/agent/src/voice/native-models.ts"
      - "services/agent/src/voice/native-worker.ts"
      - "services/agent/src/voice/pcm.ts"
      - "services/agent/src/voice/routes.ts"
      - "tools/voice-regress/**"
      - ".github/workflows/voice.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/openlive-voice-regress
          key: voice-models-${{ runner.os }}-pr-${{ hashFiles('tools/voice-regress/src/engines.ts') }}
      # --strict: a model that fails to download fails the job instead of skipping.
      - run: pnpm voice:regress --strict --report report
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voice-regress-report
          path: report

  nightly:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/openlive-voice-regress
          key: voice-models-${{ runner.os }}-all-${{ hashFiles('tools/voice-regress/src/engines.ts') }}
      - run: pnpm voice:regress --engine all --strict --report report
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voice-regress-report
          path: report
