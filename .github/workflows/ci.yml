name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the run still going moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # macOS is built the way the release builds it, minus signing: one universal
  # app, with the packaged web and agent servers booted by the afterPack smoke.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Test
        run: pnpm test

      # The universal addon and helper need both Apple targets.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/ol-input
            native/openlive-cu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test computer-use helper
        run: cargo test --manifest-path native/openlive-cu/Cargo.toml --workspace

      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/**') }}
          restore-keys: next-${{ runner.os }}-

      - name: Pack web + agent + native
        run: |
          pnpm --filter @openlive/desktop pack:web
          pnpm --filter @openlive/desktop pack:agent
          pnpm --filter @openlive/desktop pack:native
          pnpm --filter @openlive/desktop pack:licenses

      - name: Build macOS app (unsigned)
        run: pnpm --filter @openlive/desktop exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - if: github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/**') }}

  # Windows parity is code-level (no hardware QA): prove the repo installs,
  # typechecks, tests, and produces an unsigned Windows build on windows-latest.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The ol-input native addon is Rust; without it Flow can't load in the build.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/ol-input
            native/openlive-cu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The computer-use helper's core and Windows backend, then the built helper
      # against this runner's desktop: handshake, permissions, listWindows over
      # its private pipe. Nothing is clicked or typed.
      - name: Test computer-use helper
        run: cargo test --manifest-path native/openlive-cu/Cargo.toml --workspace
        env:
          OPENLIVE_CU_SMOKE: "1"

      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/**') }}
          restore-keys: next-${{ runner.os }}-

      - name: Pack web + agent + native
        run: |
          pnpm --filter @openlive/desktop pack:web
          pnpm --filter @openlive/desktop pack:agent
          pnpm --filter @openlive/desktop pack:native
          pnpm --filter @openlive/desktop pack:licenses

      # --publish never: this is a build-only smoke test. Without it,
      # electron-builder's publish auto-detection demands a GH_TOKEN in
      # pull_request runs and fails the job after a successful build.
      - name: Build Windows installer (unsigned)
        run: pnpm --filter @openlive/desktop exec electron-builder --win --publish never

      - if: github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/**') }}

  # Linux parity smoke test: prove the repo installs, typechecks, tests, and
  # produces an unsigned AppImage on ubuntu-latest — same shape as the Windows job.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The ol-input native addon is Rust; without it Flow can't load in the build.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/ol-input
            native/openlive-cu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A desktop for the computer-use helper: a virtual X display, a session
      # bus that starts the accessibility bus on demand, and one GTK 3 app.
      - name: Desktop for the computer-use smoke test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb dbus at-spi2-core gtk-3-examples

      # The helper's core and Linux backend, then the built helper against that
      # desktop: handshake, permissions, listWindows, and the app's tree and
      # picture over its private socket, plus the backend's read-only live
      # check. Nothing is clicked or typed.
      - name: Test computer-use helper
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- sh -c '
            gtk3-widget-factory & sleep 3
            cargo test --manifest-path native/openlive-cu/Cargo.toml --workspace &&
            cargo test --manifest-path native/openlive-cu/Cargo.toml -p openlive-cu-linux -- --ignored --nocapture'
        env:
          OPENLIVE_CU_SMOKE: "1"
          OPENLIVE_CU_SMOKE_APP: gtk3-widget-factory

      - id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/**') }}
          restore-keys: next-${{ runner.os }}-

      - name: Pack web + agent + native
        run: |
          pnpm --filter @openlive/desktop pack:web
          pnpm --filter @openlive/desktop pack:agent
          pnpm --filter @openlive/desktop pack:native
          pnpm --filter @openlive/desktop pack:licenses

      - name: Build Linux AppImage (unsigned)
        run: pnpm --filter @openlive/desktop exec electron-builder --linux --publish never

      - if: github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/**') }}
